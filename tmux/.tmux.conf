set-option -g prefix C-a

set -g default-terminal 'tmux-256color'
set-option -ag terminal-overrides ",xterm-256color:Tc"

# Vim style pane selection.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use mouse to select in copy-mode (optional but handy)
set -g mouse on

# Every copy must reach the X clipboard through exactly one writer. Two at once
# race for the selection, and Alacritty loses the check that it became the owner:
# "Failed to set new owner of XCB selection". Claude Code inside tmux writes
# twice: it runs xclip itself and also `tmux load-buffer -w`, which forwards the
# text to the terminal as OSC 52 whatever set-clipboard says. So on a local
# server tmux never sends OSC 52 at all (Ms@ drops the capability) and copies
# through xclip; Claude Code's own xclip is then the only writer as well. A
# server started over ssh has no X to talk to and keeps OSC 52, which the
# terminal on the machine you sit at turns into a clipboard write.
# `external`, not `on`: OSC 52 printed inside panes is not forwarded either.
set -s set-clipboard external
if-shell '[ -z "$SSH_CONNECTION" ]' {
  set -as terminal-overrides ',*:Ms@'
  set -s copy-command 'xclip -selection clipboard -in'
}

# copy-pipe without a command pipes to copy-command, and with an empty one only
# fills the tmux buffer, so the same bindings work locally and over ssh.
bind -T copy-mode-vi C-c   send-keys -X copy-pipe-and-cancel
bind -T copy-mode    C-c   send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel

# bind C-h resize-pane -L

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key p paste-buffer

# Shift arrow to switch windows.
bind -n S-Left  previous-window
bind -n S-Right next-window

# switch windows with alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Renumber windows sequentially after closing any of them.
set -g renumber-windows on

# Plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

run '~/.tmux/plugins/tpm/tpm'

# A window whose Claude Code session finished a request carries @claude_done
# (set by claude/.claude/hooks/tmux-claude-done.sh); its tab text alternates
# between yellow and green until the window is selected, then is white again.
# Neither pulse colour is white, so a marked tab never looks unmarked; magenta
# was passed over because in this palette it is as pale as white. This replaces
# nord-tmux's window-status-format with the same layout and only the text colour
# made conditional, so it must come after tpm has loaded the theme. The pulse is
# the parity of the current second (status-format expands this format with T:,
# which runs strftime over it) and relies on nord-tmux's status-interval 1.
set -g @claude_tab_fg '#{?@claude_done,#{?#{m:*[02468],%S},yellow,green},white}'
set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=#{E:@claude_tab_fg},bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=#{E:@claude_tab_fg},bg=brightblack]#W #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"

# Clear the mark wherever a window becomes the one on screen: another window
# selected, another session switched to, a client attached.
set-hook -g session-window-changed 'set -wu @claude_done'
set-hook -g client-session-changed 'set -wu @claude_done'
set-hook -g client-attached        'set -wu @claude_done'
